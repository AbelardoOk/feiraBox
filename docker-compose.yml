services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: project-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
    ports:
      - '${SERVER_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: feirabox-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-feirabox}
      POSTGRES_USER: ${POSTGRES_USER:-feirabox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feirabox}

    ports:
      - '${POSTGRES_PORT:-5432}:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-feirabox} -d ${POSTGRES_DB:-feirabox}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
